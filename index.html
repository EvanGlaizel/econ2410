<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Midterm Concept Drill</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2a2f;--mute:#5d6b70;--line:#d5dbd8;--acc:#0f6b6b;--ok:#2d7a4b;--okbg:#e3f2e8;--bad:#b3402f;--badbg:#f8e5e1}
@media(prefers-color-scheme:dark){:root{--bg:#121a1d;--card:#1b2629;--ink:#e8eeec;--mute:#9aaaae;--line:#31413f;--acc:#5ec4c0;--ok:#6fd195;--okbg:#1c3a2a;--bad:#f09a8b;--badbg:#42221d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:14px 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{font-size:13px;color:var(--acc);font-weight:600}
.count{font-size:13px;color:var(--mute)}
h1{font:600 21px/1.35 Georgia,'Times New Roman',serif;margin:14px 0 16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;margin:0 0 10px;font:inherit;cursor:pointer}
.opt:active{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{margin-top:14px;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-size:15px}
.why b{display:block;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar button{flex:1;max-width:200px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px system-ui;cursor:pointer}
.bar .go{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.bar button:disabled{opacity:.4}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px 30px;display:none;z-index:5}
#sheet.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;max-width:640px;margin:14px auto}
.grid button{padding:12px 0;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui;cursor:pointer}
.grid .r{border-color:var(--ok);background:var(--okbg)}
.grid .w{border-color:var(--bad);background:var(--badbg)}
.grid .cur{outline:3px solid var(--acc)}
.sh{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.sh h2{margin:0;font-size:19px}
.sh button{padding:9px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px system-ui;cursor:pointer}
.note{max-width:640px;margin:0 auto;color:var(--mute);font-size:14px}
@media(prefers-reduced-motion:no-preference){.why{animation:f .18s ease-out}@keyframes f{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar">
  <button id="prev">Back</button>
  <button id="jump">Jump to</button>
  <button id="next" class="go">Next</button>
</div>
<div id="sheet" role="dialog" aria-label="Jump to question">
  <div class="sh"><h2>Jump to a question</h2><button id="close">Close</button></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="score"></p>
  <p class="note">Green = answered correctly, red = missed. This resets when you reload. Bookmark the page while on a question to return to it.</p>
</div>
<script>
// [chapter, question, CORRECT, wrong, wrong, wrong, explanation]
// Correct answer position is set automatically and varies from question to question.
const Q=[
// Round 1
[7,"Two economies have the same unemployment rate. Which of these can still differ sharply between them?","How fast workers move in and out of unemployment","Whether wages depend on the price level expected","Whether markups of firms are above zero or not","Whether unemployed people count as being employed","The same rate can hide a lively labor market with many hires and separations, or a stagnant one with few. The rate alone does not reveal the flows."],
[8,"At the natural rate of unemployment, which statement about inflation must be true?","Actual inflation equals expected inflation","Actual inflation is exactly equal to zero","Actual inflation equals the central bank target","Actual inflation is falling by a steady amount","The natural rate is where u = uₙ, so π = πᵉ. That need not mean zero inflation or the target; it depends on what is expected."],
[9,"Output is above potential. What does this imply about unemployment?","It is below the natural rate","It is above the natural rate","It equals the natural rate","It is rising toward the natural rate","Y − Yₙ = −L(u − uₙ). A positive output gap corresponds to unemployment below its natural rate."],
// Round 2
[7,"A discouraged worker stops searching but would take a job if offered one. What happens to the measured rates?","Unemployment rate falls, employment rate unchanged","Unemployment rate rises, employment rate unchanged","Both rates fall by the same amount together","Both rates remain unchanged because jobs are same","The person leaves the labor force, so the unemployment rate drops. Employment is unchanged, so the employment rate is unchanged too."],
[8,"In the original Phillips curve (θ = 0), what does low unemployment imply?","A high level of inflation","A rising rate of inflation","A falling level of inflation","No effect on inflation levels","With anchored expectations the curve links the inflation level to unemployment. The change-in-inflation version comes only when θ = 1."],
[9,"In the medium run, which variable does monetary policy actually determine?","The inflation rate and the nominal interest rate","The unemployment rate and the output level","The natural rate of interest and potential output","The output gap and the real borrowing rate","This is neutrality of money: real variables return to their natural values, so policy only pins down inflation and the nominal rate."],
// Round 3
[7,"Why do the employment rate and the unemployment rate not add up to one?","They are divided by different population groups","One of them counts discouraged workers twice","Part-time workers are left out of one measure","The labor force changes every single month","Employment rate = employment / population available for work. Unemployment rate = unemployed / labor force. Different denominators."],
[8,"Why did the original Phillips curve break down in the 1970s?","Wage setters changed how they formed expectations","Workers stopped caring about real wages entirely","Unemployment stopped affecting wage bargaining","Firms lost all of their pricing power over time","Persistent inflation raised θ, so expected inflation began to track last year's inflation and the old relation vanished."],
[9,"Why can't a central bank simply set the real rate at rₙ right away?","It is unsure where potential is and effects take time","Interest rates cannot be changed within a single year","The real rate is set only by private lenders","The nominal rate must always move with money growth","Two complications: potential output is not observed exactly, and the economy responds to rate changes with a lag."],
// Round 4
[7,"Why does the nominal wage depend on the expected price level rather than the actual one?","Wages are set before the actual price level is known","Workers are unable to observe any price changes","Firms prefer to pay according to expected profits","The actual price level never affects real wages","Nominal wages are fixed for a period. If prices turn out different from expected, wages are usually not readjusted."],
[8,"With θ = 1 and unemployment held below the natural rate forever, what happens to inflation?","It keeps rising year after year","It jumps once and then stays constant","It falls gradually back toward the target","It stays equal to the starting level","When θ = 1, π − π₋₁ = −α(u − uₙ). Below uₙ the right side is positive every year, so inflation accelerates."],
[9,"Higher money growth is sustained permanently in the medium run. What happens to the real interest rate?","It stays at the natural rate","It rises in proportion to money growth","It falls by the amount inflation rises","It falls to zero over a long time","Neutrality: i = rₙ + gₘ. The nominal rate and inflation rise one-for-one with money growth; the real rate is unchanged."],
// Round 5
[7,"Which change raises the bargaining power of a worker?","The firm would find replacement costly","The unemployment rate in the economy rises","The job needs only routine, quickly learned skills","Fewer vacancies are open in other firms","Bargaining power rises when replacing the worker is costly and when finding another job is easy, which is more likely at low unemployment."],
[8,"Expectations are anchored and there is an energy price shock. When the shock fades, what is the best-case outcome?","Inflation returns to target without a recession","Inflation stays high until a recession occurs","Inflation keeps rising at a slower rate","Inflation turns negative for several years","If πᵉ stays at the target, inflation returns to it once m + z returns to normal. No rise in unemployment is needed."],
[9,"What does deanchoring do to the central bank's task after a positive output gap?","Inflation is above target even once output is back at potential","Inflation returns to target as soon as output is at potential","The output gap becomes impossible for it to measure","The natural rate of interest becomes negative at once","With πᵉ = π₋₁, inflation keeps rising while the gap is positive. Getting back to target then needs output below potential for a time."],
// Round 6
[7,"A firm pays more than the reservation wage. Which explanation matches efficiency wage theory?","Higher pay raises productivity and lowers quits","Higher pay is required by law in every market","Higher pay lets the firm cut prices to rivals","Higher pay shifts the price-setting curve downward","Efficiency wage theories link pay to worker effort, morale, and turnover. A wage above reservation makes staying more attractive."],
[8,"Which feature separates the accelerationist Phillips curve from the original one?","It links unemployment to the change in inflation","It links unemployment to the level of wages","It assumes expectations never depend on past data","It assumes the natural rate is always zero","Under θ = 1, unemployment below uₙ means inflation is increasing, not just high."],
[9,"What does the zero lower bound do when there is deflation?","The lowest real rate achievable is positive","The lowest real rate achievable is negative","The central bank can no longer change the output gap","The nominal rate is forced to equal the real rate","r = i − πᵉ. With i = 0 and expected deflation, r = −πᵉ > 0. The bank cannot push the real rate down enough."],
// Round 7
[7,"Unemployment benefits become more generous. What happens in the wage-setting and price-setting model?","The natural rate rises and the real wage is unchanged","The natural rate rises and the real wage rises too","The natural rate is unchanged and the real wage rises","The natural rate falls and the real wage is unchanged","WS shifts up and the economy moves along the flat PS line. The real wage is pinned down by the markup, so only unemployment rises."],
[8,"Higher wage indexation (larger λ) changes the Phillips curve in which way?","Unemployment has a larger effect on inflation","Unemployment has a smaller effect on inflation","Expected inflation no longer matters to inflation","The natural rate of unemployment must fall","With indexation the slope becomes α/(1−λ). A price rise feeds back to wages within the year, which feeds back to prices."],
[9,"What is the real rate called at which demand equals potential output?","The natural (neutral) rate of interest","The nominal policy rate in the short run","The real borrowing rate including risk premium","The zero lower bound real rate of return","rₙ is the rate consistent with Y = Yₙ. The real borrowing rate is rₙ + x, which includes the risk premium."],
// Round 8
[7,"Firms raise their markup. Which curve shifts, and what happens to unemployment?","PS shifts down and the natural rate rises","PS shifts up and the natural rate rises","WS shifts up and the natural rate falls","WS shifts down and the natural rate falls","A higher markup lowers the real wage implied by price setting, 1/(1+m). Higher unemployment is needed to make workers accept it."],
[8,"Which statement about the Phillips curve in a deflation is best supported?","It weakens because nominal wages resist falling","It strengthens because real wages move more freely","It becomes the same as the accelerationist form","It disappears because the natural rate is zero","Workers accept a real wage cut via slow nominal growth but fight an overt nominal cut, so wages and inflation fall less than expected."],
[9,"Which describes the deflation spiral?","Lower output gives deflation, raising the real rate, lowering output","Higher output gives inflation, raising the real rate again","Lower output gives deflation, lowering the real rate further","Higher output gives deflation, lowering the nominal rate","At the zero bound, more deflation means a higher real rate, which cuts spending further and creates still more deflation."],
// Round 9
[7,"What does the term 'natural' rate of unemployment wrongly suggest?","That it is fixed and unaffected by institutions","That it is always equal to the actual rate","That it can never differ between two countries","That it is measured directly each month","It depends on z and m, which reflect benefits, bargaining, and market power. 'Structural' would describe it better."],
[8,"Which pair of terms is matched correctly?","Anchored expectations and θ near zero","Anchored expectations and θ equal to one","Deanchored expectations and θ equal to zero","Deanchored expectations and a constant πᵉ","Anchored: πᵉ ≈ target regardless of past inflation (θ ≈ 0). Deanchored: πᵉ tracks last year's inflation (θ → 1)."],
[9,"The central bank is deciding how fast to tighten. Which dilemma does the model stress?","Uncertainty argues for going slow; deanchoring risk for fast","Uncertainty argues for going fast; lags argue for slow","Credibility argues for going slow; lags for going fast","The zero bound argues for going slow; risk for fast","Moving slowly lets the bank learn about potential. But the longer inflation exceeds target, the likelier expectations deanchor."],
// Round 10
[7,"In this model, what ultimately fixes the equilibrium real wage?","Price-setting behavior through the markup","The strength of worker bargaining power","The generosity of unemployment benefits","The level of the minimum wage in force","W/P = 1/(1+m) from price setting. Wage-setting factors change unemployment, not the real wage."],
[8,"During the Covid inflation, what was the main channel according to the course?","A higher markup from higher input costs","Very low unemployment alone raising wages","Fully deanchored long-run expectations","A large rise in the natural rate of interest","Energy and supply chain costs raised prices given wages, which is a rise in m. Long-run expectations stayed largely anchored."],
[9,"A fiscal consolidation (higher taxes) hits at potential. What is the medium-run composition of output?","Same output, lower consumption, higher investment","Lower output, lower consumption, lower investment","Same output, higher consumption, lower investment","Lower output, higher consumption, higher investment","The bank cuts r until Y = Yₙ again. Taxes lower consumption, and the lower rate raises investment by an offsetting amount."],
// Round 11
[7,"Why is a high unemployment rate bad for both employed and unemployed workers?","Job losing risk rises and job finding odds fall","Job losing risk falls and job finding odds rise","Both employed and unemployed workers see wages rise","Firms stop using both layoffs and fewer hires","Firms cut employment through fewer hires and more layoffs. The unemployed wait longer and the employed face more risk."],
[8,"Why does the Phillips curve become tenuous at very high inflation?","Wage contracts shorten and indexation spreads","Workers ignore all information about the price level","Natural unemployment becomes equal to the inflation","Firms lower markups sharply to protect real wages","As λ nears 1, small unemployment changes give big inflation changes, so the relation eventually disappears."],
[9,"Which best describes why economists disagree about policies like fiscal consolidation?","They differ on how fast output returns to potential","They use different definitions of the output gap","They disagree about whether the IS curve slopes down","They disagree about whether money is neutral at all","Short-run effects differ from medium-run ones. If you think adjustment is slow, you weigh the short run more."],
// Round 12
[7,"Perfect competition in goods markets would mean what for price setting?","Price equals marginal cost, so the markup is zero","Price equals the expected price level exactly","Price equals the wage times the unemployment rate","Price is set by the firm above the marginal cost","With m = 0, P = W and the real wage is 1. Firms with market power charge P = (1+m)W with m > 0."],
[8,"How did Friedman and Phelps view the trade-off between inflation and unemployment?","It is temporary and comes from rising inflation","It is permanent as long as inflation is moderate","It exists only when expectations are anchored","It exists only while unemployment is above natural","Policymakers can lower u below uₙ only while inflation exceeds what was expected. Once expectations adjust, the gain vanishes."],
[9,"A supply shock cuts potential output while actual output is unchanged. What appears?","A positive output gap and pressure on inflation","A negative output gap and pressure to deflation","No output gap because output is unchanged","A lower natural rate of interest and unemployment","Y is the same but Yₙ falls, so Y > Yₙ. Inflation rises, much like an overheating economy from demand."],
// Round 13
[7,"Why can the wage-setting relation be said to give involuntary unemployment?","Workers prefer jobs at the wage that is paid","Workers choose not to take the wage on offer","Firms refuse to hire anyone at positive wages","The labor force always shrinks when wages rise","Wages above the reservation wage mean the unemployed would rather be employed, unlike in a standard supply-demand model."],
[8,"Under θ = 1, unemployment is held at exactly the natural rate. What happens to inflation?","It stays constant at last period's level","It returns to the target over several periods","It falls steadily toward zero inflation","It rises by α each period that follows","π − π₋₁ = 0, so inflation is stuck wherever it already was. Nothing pulls it back to the target."],
[9,"What will keep inflation stable after a permanent rise in government spending?","The central bank must raise the real rate","The central bank must lower the real rate","The central bank can leave the real rate unchanged","The central bank must raise only the nominal rate","Higher G shifts IS right. To keep Y = Yₙ, a higher r is needed, so the natural rate of interest rises."],
// Round 14
[7,"A rise in z, such as a higher minimum wage, shifts which relation and in which direction?","Wage setting shifts up","Wage setting shifts down","Price setting shifts up","Price setting shifts down","z is defined so a higher value means a higher wage at a given u. That moves WS up, not PS."],
[8,"Which describes the best explanation for the re-anchoring of expectations since the 1990s?","The central bank became credible about its target","Workers began ignoring all news about prices","Unemployment stayed above the natural rate","Supply shocks stopped affecting any prices","Stable inflation and a clear commitment led people to expect inflation near target even when it was temporarily higher."],
[9,"Which statement about the medium-run nominal interest rate is correct?","It equals the natural real rate plus target inflation","It equals the natural real rate and nothing more","It is independent of the inflation target chosen","It equals the growth rate of potential output","i = r + πᵉ. In the medium run, r = rₙ and πᵉ = π̄, so a higher target means a higher nominal rate."],
// Round 15
[7,"The wage-setting curve slopes downward in (u, W/P) space. What is the logic?","Higher unemployment weakens workers' bargaining position","Higher unemployment strengthens workers' bargaining position","Higher unemployment raises worker productivity directly","Higher unemployment raises the reservation wage itself","With more unemployed, replacements are easy and outside jobs scarce, so wage setters choose a lower real wage."],
[8,"Which is the most accurate reason a supply shock can have lasting effects on inflation?","Deanchored expectations amplify the first increase","Unemployment always rises sharply after the shock","The markup never returns to its earlier value","The natural rate of unemployment is always constant","If expectations adjust to the initial rise, the shock feeds on itself, as in the 1970s, instead of fading when costs normalize."],
[9,"Which statement about the economy in a medium-run equilibrium is accurate?","Output, unemployment, and the real rate sit at natural levels","Output equals potential but the real rate can differ","Inflation is zero and unemployment equals zero","Inflation is rising but the output gap is zero","Y = Yₙ, u = uₙ, r = rₙ, π = π̄ = πᵉ. Inflation equals target, which need not be zero."],
// Round 16
[7,"Firms shrink employment using only fewer hires, with no layoffs. Who is hurt most directly?","The unemployed, who wait longer to find a job","The employed, who now face a higher risk of layoff","Both groups equally, since the flows are symmetric","Neither group, since the unemployment rate is stable","Fewer hires mean fewer openings and more applicants per opening. Employed workers are hurt only if layoffs also rise."],
[8,"Expected inflation rises by 2 points while unemployment and (m + z) stay put. What happens to inflation?","It rises by 2 points, one for one","It rises by 2 points divided by alpha","It rises by less than 2 points, set by theta","It is unchanged until wages are renegotiated","π = πᵉ + (m + z) − αu. Expected inflation enters with a coefficient of exactly one, whatever θ is."],
[9,"The risk premium x rises permanently and the economy is at potential. What must the central bank do to keep output at potential?","Lower r so the real borrowing rate stays the same","Raise r so the real borrowing rate rises further","Leave r alone since only the IS curve moves","Raise r to offset the lower consumption demand","Demand depends on r + x. If x rises, r must fall by the same amount, so rₙ falls while the borrowing rate is unchanged."],
// Round 17
[7,"The share of unemployed workers leaving unemployment each month rises. What happens to average unemployment duration?","It falls, since it is the inverse of that share","It rises, since more flows mean more turnover","It is unchanged unless the unemployment rate moves","It rises, since leavers include those who quit searching","Duration = 1 / (share leaving). Leaving includes both finding a job and dropping out, but the inverse relation still holds."],
[8,"A larger alpha is estimated, with m and z unchanged. What happens to the natural rate of unemployment?","It falls, since uₙ = (m + z) / α","It rises, since unemployment matters more for wages","It is unchanged, since α is only a slope parameter","It rises, since inflation reacts more strongly","α only scales the effect of u on inflation, but uₙ = (m + z)/α, so a bigger α lowers the natural rate."],
[9,"A permanent rise in consumer confidence occurs and the economy was at potential. What happens to the natural rate of interest?","It rises, since higher r is needed to hold output down","It falls, since higher confidence lowers the risk premium","It is unchanged, since confidence is not a policy lever","It falls, since output must be reduced by the central bank","IS shifts right. To keep Y = Yₙ the real rate must be higher, so rₙ rises."],
// Round 18
[7,"A worker outside the labor force starts searching and has not yet found a job. What happens to the measured rates?","Unemployment rate rises and participation rate rises","Unemployment rate rises and participation rate is unchanged","Unemployment rate is unchanged and participation rises","Both are unchanged until the worker finds a job","The person moves into the labor force as unemployed. Labor force and unemployed both rise, so both rates go up."],
[8,"With θ = 1, unemployment is above the natural rate. Which statement is correct?","Inflation is falling, though it may still be positive","Inflation is negative, since unemployment is too high","Inflation returns to the target level next year","Inflation is constant at the level of last year","π − π₋₁ = −α(u − uₙ) < 0. The change is negative, but the level can remain positive for a long time."],
[9,"Output stays above potential, but expectations remain fully anchored at target. What happens to inflation?","It stays above target at a constant level","It rises further each period that follows","It falls back toward the target gradually","It equals expected inflation from now on","With πᵉ = π̄, π − π̄ = (α/L)(Y − Yₙ). A constant gap gives a constant inflation excess, not acceleration."],
// Round 19
[7,"Workers and firms both expect prices to double. What happens to wages in the model?","Nominal wage doubles and the real wage is unchanged","Nominal wage doubles and the real wage doubles","Nominal wage is unchanged and the real wage halves","Nominal wage rises less than double as u rises","Both sides care about W/P, so a doubled expected price level doubles the nominal wage and leaves the real wage alone."],
[8,"Policy holds unemployment below the natural rate for a long time under the original Phillips curve (θ = 0). What results?","Inflation stays permanently above target, not rising","Inflation rises steadily with no limit at all","Inflation returns to target as expectations adjust","Inflation falls since firms raise markups less","With θ = 0 the gap in inflation is α(uₙ − u), a constant. Accelerating inflation requires θ = 1."],
[9,"The central bank raises the policy rate. How is this shown in the IS-LM diagram?","A move up along the IS curve as LM shifts up","A shift of the IS curve to the left at that rate","A shift of the PC curve to the right in output","A move along LM to a point of higher output","The policy rate is the LM line. IS is unchanged, so the economy slides up along IS to lower output."],
// Round 20
[7,"Prices turn out higher than wage setters expected after nominal wages were fixed. What is the real wage?","Lower than the real wage that was intended","Higher than the real wage that was intended","The same as intended, since W/P is set by markup","Higher, since firms respond to higher prices","W was set using Pᵉ. If P > Pᵉ, then W/P is below what was targeted when wages were set."],
[8,"Unemployment is below the natural rate for one year and then returns to it. With θ = 1, what happens to inflation?","It stays at its higher level and does not return","It returns to its earlier level the next year","It keeps rising by the same amount each year","It falls below its earlier level the next year","The gap raised π once. When u = uₙ, π − π₋₁ = 0, so inflation stays at the new, higher level."],
[9,"The nominal money stock doubles permanently in the medium run. What happens to real money M/P?","It is unchanged because the price level doubles","It doubles because prices adjust only partially","It is unchanged because the real rate also falls","It falls because higher inflation reduces demand","Real money demand is Yₙ L(rₙ + π̄), which is constant. So P must rise in proportion to M."],
// Round 21
[7,"A fall in u raises the real wage chosen in wage setting. How is this shown in the diagram?","A movement along the WS curve","An upward shift of the WS curve","A downward shift of the PS curve","An upward shift of the PS curve","u is on the horizontal axis. A change in u moves along WS. Only a change in z shifts WS."],
[8,"Which statement about Friedman's temporary trade-off argument is correct?","It comes from inflation exceeding what was expected","It comes from inflation being high in general","It comes from wage setters ignoring real wages","It comes from a lower natural rate of unemployment","Unemployment falls below uₙ only when inflation surprises wage setters. Once expectations adjust, the gain disappears."],
[9,"The nominal rate is zero and expected inflation falls from −1% to −3%. What happens to the real rate?","It rises by two points","It falls by two points","It is unchanged since i is fixed at zero","It rises by one point only","r = i − πᵉ = 0 − (−3%) = 3%, up from 1%. Deeper expected deflation raises the real rate when i cannot fall."],
// Round 22
[7,"Both m and z rise at once. What happens to the natural rate and the real wage?","Natural rate rises and the real wage falls","Natural rate rises and the real wage rises","Natural rate falls and the real wage falls","Natural rate is ambiguous and the real wage falls","WS shifts up and PS shifts down, so unemployment must rise. The real wage is 1/(1+m), which falls."],
[8,"An energy shock lifts m, but actual unemployment stays at the old natural rate and θ = 0. What happens to inflation?","It rises above expected inflation","It stays equal to expected inflation","It falls below expected inflation","It rises only if expectations de-anchor","The natural rate rises, so u < uₙ. By π − πᵉ = −α(u − uₙ), inflation rises above expected."],
[9,"Which describes the effect of a larger labor force L on the Phillips curve in output terms?","The slope α/L falls, so the PC is flatter","The slope α/L rises, so the PC is steeper","The PC shifts left since potential output rises","The PC is unaffected since L cancels out entirely","π − πᵉ = (α/L)(Y − Yₙ). Holding α fixed, a bigger L means a given output gap represents a smaller unemployment gap."],
// Round 23
[7,"Employed workers leave the labor force and nobody else moves. What happens to the unemployment rate?","It rises, since the labor force shrinks","It falls, since fewer people are employed","It is unchanged, since nobody became unemployed","It rises, since the number unemployed rises","Unemployed U stays the same while L falls, so U/L rises. This shows why the rate alone can mislead."],
[8,"All labor contracts become fully indexed (λ near one). What happens to the effect of unemployment on inflation?","It becomes very large since α/(1−λ) is huge","It becomes zero since wages track actual prices","It is unchanged since indexation affects only levels","It becomes negative since wages overshoot prices","Prices raise wages within the year, which raises prices again. Small unemployment changes then produce large inflation changes."],
[9,"What does an economy at potential output imply for unemployment?","It equals the natural rate, which is above zero","It equals zero since all workers are employed","It equals the actual rate of last period","It equals the rate where inflation is zero","Y = Yₙ means u = uₙ. The natural rate is positive because of frictions, bargaining, and markups."],
// Round 24
